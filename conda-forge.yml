bot:
  automerge: true
build_platform:
  linux_riscv64: linux_64
  win_arm64: win_64
conda_build:
  error_overlinking: false
conda_build_tool: rattler-build
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
shellcheck:
  enabled: true
test: native_and_emulated
workflow_settings:
  free_disk_space: max
  pagefile_size: 22
