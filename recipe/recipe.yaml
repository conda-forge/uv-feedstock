# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: uv
  version: ${{ version }}

source:
  url: https://github.com/astral-sh/uv/releases/download/${{ version }}/source.tar.gz
  sha256: 3d6cbbfd054cbea49336881fffdc2cdd366602a9df974285e84f5cedb25283e8
  patches:
    - 0000-no-link-static-vc-runtime.patch
    - 0001-no-writeln-space-colon.patch
    - 0002-zstd-pkg-config.patch

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # This env var specifies the base 2 log of the allocator page size
      JEMALLOC_SYS_WITH_LG_PAGE: ${{ "16" if target_platform == "linux-aarch64" or target_platform == "linux-ppc64le" }}
      # for cross-compiling issues
      #   fatal error LNK1112: module machine type 'x64' conflicts with target machine type 'ARM64'
      AWS_LC_SYS_CMAKE_BUILDER: "1"
      # for cross-compiling issues
      #   error LNK2019: unresolved external symbol ZSTD_compressStream
      ZSTD_SYS_USE_PKG_CONFIG: "1"
      # for cross-compiling issues
      #   Can't probe for zstd in pkg-config: pkg-config has not been configured to support cross-compilation.
      PKG_CONFIG_ALLOW_CROSS: "1"
    content:
      - if: unix and build_platform != target_platform
        then:
          - unset PKG_CONFIG_SYSROOT_DIR
          - export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
          - export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
      - if: win
        then:
          - set "PKG_CONFIG_SYSROOT_DIR=%PREFIX%"
          - set "PKG_CONFIG_PATH=%LIBRARY_PREFIX%\lib\pkgconfig"
      - if: osx
        then:
          - export DYLD_LIBRARY_PATH=${PREFIX}/lib:${DYLD_LIBRARY_PATH:-}
      - cd crates/uv
      - cargo auditable install --no-track --locked --path=. --profile=release --root="${{ '${PREFIX}' if unix else '%LIBRARY_PREFIX%' }}"
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      - if: unix and build_platform == target_platform
        then:
          - mkdir -p "${PREFIX}/share/bash-completion/completions" "${PREFIX}/share/fish/vendor_completions.d" "${PREFIX}/share/zsh/site-functions"
          - |-
            "${PREFIX}/bin/uv" generate-shell-completion bash       > "${PREFIX}/share/bash-completion/completions/uv"
          - |-
            "${PREFIX}/bin/uv" generate-shell-completion fish       > "${PREFIX}/share/fish/vendor_completions.d/uv.fish"
          - |-
            "${PREFIX}/bin/uv" generate-shell-completion zsh        > "${PREFIX}/share/zsh/site-functions/_uv"
      - if: win and build_platform == target_platform
        then:
          - md "%LIBRARY_PREFIX%\share\bash-completion\completions" "%LIBRARY_PREFIX%\share\fish\vendor_completions.d" "%LIBRARY_PREFIX%\share\zsh\site-functions"
          - |-
            "%LIBRARY_BIN%\uv.exe" generate-shell-completion bash   > "%LIBRARY_PREFIX%\share\bash-completion\completions\uv"
          - |-
            "%LIBRARY_BIN%\uv.exe" generate-shell-completion fish   > "%LIBRARY_PREFIX%\share\fish\vendor_completions.d\uv.fish"
          - |-
            "%LIBRARY_BIN%\uv.exe" generate-shell-completion zsh    > "%LIBRARY_PREFIX%\share\zsh\site-functions\_uv"

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - pkg-config
    # TODO: remove condition after https://github.com/conda-forge/make-feedstock/pull/36
    - if: target_platform != "win-arm64"
      then:
        - make
  host:
    - zstd

tests:
  - package_contents:
      strict: true
      bin:
        - uv
        - uvx
      files:
        - if: build_platform == target_platform
          then:
            - ${{ "Library/" if win }}share/bash-completion/completions/uv
            - ${{ "Library/" if win }}share/fish/vendor_completions.d/uv.fish
            - ${{ "Library/" if win }}share/zsh/site-functions/_uv
  - script:
      - uv --help
      - uv --version
      - uv --version | ${{ "grep -iE " if unix else "findstr /r /c:" }}${{ version | replace('.', '\\.') }}

about:
  homepage: https://github.com/astral-sh/uv
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - crates/uv/THIRDPARTY.yml
  summary: An extremely fast Python package installer and resolver, written in Rust.
  documentation: https://docs.astral.sh/uv

extra:
  recipe-maintainers:
    - charliermarsh
    - bollwyvl
